services:
  lifetide:
    build: .
    ports:
      - "3003:3000"
    environment:
      # ── Database ──
      DATABASE_URL: "file:/app/data/lifetide.db"
      # ── Auth ──
      JWT_SECRET: "lifetide-lite-secret-change-in-production"
      ADMIN_EMAIL: "haayy@foxmail.com"
      NEXT_PUBLIC_ADMIN_EMAIL: "haayy@foxmail.com"
      # ── AI Provider ──
      AI_PROVIDER: "aiping"
      AIPING_API_KEY: "QC-0e9e15765fbce7dff3017fd25460f2da-73fcf8827b543de2ef30656d746e5e7d"
      AIPING_BASE_URL: "https://aiping.cn/api/v1"
      AIPING_MODEL: "Qwen3.7-Plus"
      MULTIMODAL_MODEL: "Qwen3.5-Flash"
      # ── GitHub (for star button) ──
      NEXT_PUBLIC_GITHUB_URL: "https://github.com/Haaaiawd/lifetide-lite"
    volumes:
      - lifetide-data:/app/data
    restart: unless-stopped

volumes:
  lifetide-data:
